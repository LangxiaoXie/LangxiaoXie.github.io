<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:         white;
            --fg:         #282828;
            --fg2:        #504945;
            --fg4:        #676767;
            --fg5:        #969696;
            --bg1:        #ebdbb2;
            --bg2:        #d5c4a1;
            --border:     color-mix(in srgb, #282828 12%, transparent);
            --hover-bg:   rgba(128,128,128,0.08);
            --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-serif: 'Source Serif 4', 'Iowan Old Style BT', Georgia, serif;
        }

        [data-theme="dark"] {
            --bg:         #282828;
            --fg:         #ebdbb2;
            --fg2:        #d5c4a1;
            --fg4:        #a89984;
            --fg5:        #7c6f64;
            --bg1:        #3c3836;
            --bg2:        #504945;
            --border:     color-mix(in srgb, #ebdbb2 12%, transparent);
            --hover-bg:   rgba(235,219,178,0.06);
        }

        html { overflow-y: scroll; scroll-padding-top: 4rem; }

        body {
            font-family: var(--font-serif);
            font-size: 17px;
            line-height: 1.6;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ── Nav ── */
        .site-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background-color: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 200;
            transition: background-color 0.3s ease;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-family: var(--font-sans);
            font-size: 0.85rem;
        }

        .nav-left a {
            color: var(--fg4);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-left a:hover { color: var(--fg); }
        .nav-sep { color: var(--fg5); }

        .theme-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--bg1);
            border: 1.5px solid var(--border);
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, background-color 0.3s;
        }

        .theme-btn::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--fg4);
            top: 5px;
            left: 5px;
            transition: transform 0.3s ease, background-color 0.3s;
        }

        [data-theme="dark"] .theme-btn::before {
            transform: translateX(8px);
            background-color: var(--bg1);
        }

        .theme-btn:hover { border-color: var(--fg4); }
        .theme-btn:focus { outline: none; box-shadow: 0 0 0 2px var(--fg4); }

        /* ── Page wrap ── */
        .page-wrap {
            max-width: calc(660px + 2 * 1.3rem);
            margin: 0 auto;
            padding: 5rem 1.3rem 6rem;
            position: relative;
            z-index: 1;
        }

        .page-wrap h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.7rem, 4vw, 2.4rem);
            font-weight: 600;
            line-height: 1.15;
            color: var(--fg);
            margin: 0 0 1rem;
            letter-spacing: -0.01em;
        }

        /* ── Meta line (social links) ── */
        .page-meta {
            font-family: var(--font-sans);
            font-size: 0.82rem;
            color: var(--fg4);
            display: flex;
            gap: 1.4rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .page-meta a {
            color: var(--fg4);
            text-decoration: none;
            transition: color 0.2s;
        }

        .page-meta a:hover { color: var(--fg); }

        /* ── Body text ── */
        .page-wrap p { margin: 0 0 1em; color: var(--fg); }

        .page-wrap a {
            color: var(--fg);
            text-decoration: underline;
            text-decoration-color: color-mix(in srgb, var(--fg) 20%, transparent);
            transition: color 0.2s, text-decoration-color 0.2s;
        }

        .page-wrap a:hover {
            color: var(--fg2);
            text-decoration-color: color-mix(in srgb, var(--fg2) 35%, transparent);
        }

        .page-wrap a:visited { color: var(--fg); }
        .page-wrap a:visited:hover { color: var(--fg2); }

        /* ── Details ── */
        details { margin: 1rem 0; }

        summary {
            font-family: var(--font-sans);
            font-size: 0.88rem;
            list-style: none;
            position: relative;
            padding-left: 1.2rem;
            cursor: pointer;
            color: var(--fg4);
            transition: color 0.2s;
        }

        summary::-webkit-details-marker { display: none; }

        summary::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0; height: 0;
            border-top: 0.3em solid transparent;
            border-bottom: 0.3em solid transparent;
            border-left: 0.4em solid currentColor;
            transform: translateY(-50%);
            transition: transform 0.2s;
        }

        details[open] summary::before { transform: translateY(-50%) rotate(90deg); }
        summary:hover { color: var(--fg); }
        details[open] summary { margin-bottom: 0.5rem; }
        details p { font-size: 0.95rem; color: var(--fg2); }

        /* ── Entries (projects & essays listing) ── */
        .entries {
            border-top: 1px solid var(--border);
            padding-top: 2rem;
            margin-top: 0.5rem;
        }

        .entry {
            margin-bottom: 2.2rem;
            padding-bottom: 2.2rem;
            border-bottom: 1px solid var(--border);
        }

        .entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        .entry-title {
            margin: 0 0 0.3rem;
            font-size: 1rem;
            line-height: 1.4;
        }

        .entry-title a {
            text-decoration: none !important;
            font-weight: 500;
            color: var(--fg);
            transition: opacity 0.2s;
        }

        .entry-title a:hover { opacity: 0.65; }

        .entry-sub {
            color: var(--fg4);
            font-style: italic;
            font-weight: 400;
        }

        .entry-desc {
            font-family: var(--font-serif);
            font-size: 0.93rem;
            color: var(--fg4);
            margin: 0.2rem 0 0;
        }

        /* ── Game controls ── */
        .game-controls {
            margin-top: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            position: relative;
            z-index: 201;
        }

        .game-controls button {
            font-family: var(--font-sans);
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            background-color: transparent;
            color: var(--fg4);
            border: 1px solid var(--border);
            padding: 0.4rem 0.9rem;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .game-controls button:hover {
            background-color: var(--hover-bg);
            color: var(--fg);
            border-color: var(--fg4);
        }

        .game-controls button.active {
            background-color: var(--bg1);
            color: var(--fg);
            border-color: var(--bg2);
        }

        [data-theme="dark"] .game-controls button.active {
            background-color: var(--bg2);
        }

        /* ── Canvas ── */
        canvas#gameCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-color: var(--bg);
            transition: background-color 0.3s ease;
        }

        canvas#interactionCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            background-color: transparent;
            pointer-events: none;
            cursor: default;
        }

        canvas#interactionCanvas.draw-mode {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .site-nav { padding: 0 1rem; }
            .page-wrap { padding: 4.5rem 1rem 4rem; }
            .page-wrap h1 { font-size: 1.6rem; }
            .page-meta { gap: 1rem; }
        }
    </style>
    <script>
        (function() {
            var root = document.documentElement;
            function applyTheme(t) {
                if (t === 'dark') root.setAttribute('data-theme','dark');
                else root.removeAttribute('data-theme');
            }
            var stored; try { stored = localStorage.getItem('theme'); } catch(e) {}
            var sys = false; try { sys = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) {}
            applyTheme(stored || (sys ? 'dark' : 'light'));
        })();
    </script>
</head>
<body>
    <header class="site-nav">
        <div class="nav-left">
            <a href="{{ site.baseurl }}/">Luc Xie</a>
            <span class="nav-sep">/</span>
            <a href="{{ site.baseurl }}/projects/">Projects</a>
            <span class="nav-sep">/</span>
            <a href="{{ site.baseurl }}/essays/">Essays</a>
        </div>
        <button id="themeBtn" class="theme-btn" aria-label="Toggle theme"></button>
    </header>

    {{ content }}

    <script>
        (function() {
            var root = document.documentElement;
            function applyTheme(t) {
                if (t === 'dark') root.setAttribute('data-theme','dark');
                else root.removeAttribute('data-theme');
            }
            function getStored() { try { return localStorage.getItem('theme'); } catch(e) { return null; } }
            function setStored(t) { try { localStorage.setItem('theme', t); } catch(e) {} }
            var btn = document.getElementById('themeBtn');
            if (btn) {
                btn.addEventListener('click', function() {
                    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    applyTheme(next); setStored(next);
                });
            }
            var mql; try { mql = window.matchMedia('(prefers-color-scheme: dark)'); } catch(e) {}
            if (mql) {
                var fn = function(e) { if (!getStored()) applyTheme(e.matches ? 'dark' : 'light'); };
                if (mql.addEventListener) mql.addEventListener('change', fn);
                else if (mql.addListener) mql.addListener(fn);
            }
        })();
    </script>
</body>
</html>
