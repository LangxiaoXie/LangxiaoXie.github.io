<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title }} — {{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:         white;
            --fg:         #282828;
            --fg2:        #504945;
            --fg4:        #676767;
            --fg5:        #969696;
            --bg1:        #ebdbb2;
            --bg2:        #d5c4a1;
            --border:     color-mix(in srgb, #282828 12%, transparent);
            --link-underline: color-mix(in srgb, #282828 20%, transparent);
            --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-serif: 'Source Serif 4', 'Iowan Old Style BT', Georgia, serif;
        }

        [data-theme="dark"] {
            --bg:         #282828;
            --fg:         #ebdbb2;
            --fg2:        #d5c4a1;
            --fg4:        #a89984;
            --fg5:        #7c6f64;
            --bg1:        #3c3836;
            --bg2:        #504945;
            --border:     color-mix(in srgb, #ebdbb2 12%, transparent);
            --link-underline: color-mix(in srgb, #ebdbb2 25%, transparent);
        }

        html { overflow-y: scroll; scroll-padding-top: 4rem; }

        body {
            font-family: var(--font-serif);
            font-size: 17px;
            line-height: 1.6;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ── Nav ── */
        .site-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background-color: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 200;
            transition: background-color 0.3s ease;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-family: var(--font-sans);
            font-size: 0.85rem;
        }

        .nav-left a { color: var(--fg4); text-decoration: none; transition: color 0.2s; }
        .nav-left a:hover { color: var(--fg); }
        .nav-sep { color: var(--fg5); }

        .theme-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            background-color: var(--bg1);
            border: 1.5px solid var(--border);
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, background-color 0.3s;
        }

        .theme-btn::before {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            border-radius: 50%;
            background-color: var(--fg4);
            top: 5px; left: 5px;
            transition: transform 0.3s ease, background-color 0.3s;
        }

        [data-theme="dark"] .theme-btn::before {
            transform: translateX(8px);
            background-color: var(--bg1);
        }

        .theme-btn:hover { border-color: var(--fg4); }
        .theme-btn:focus { outline: none; box-shadow: 0 0 0 2px var(--fg4); }

        /* ── Two-column grid ── */
        .page-grid {
            max-width: 920px;
            margin: calc(54px + 3.5rem) auto 5rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 190px 1fr;
            column-gap: 4rem;
            align-items: start;
            box-sizing: border-box;
        }

        /* ── Left column ── */
        .left-col {
            position: sticky;
            top: calc(54px + 1.5rem);
            height: fit-content;
            text-align: right;
        }

        .page-title {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--fg);
            margin: 0 0 1.2rem;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .page-meta {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--fg4);
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .page-meta a { color: var(--fg4); text-decoration: none; transition: color 0.2s; }
        .page-meta a:hover { color: var(--fg); }
        .page-meta a:visited { color: var(--fg4); }

        /* ── Right column (essay content) ── */
        .right-col { min-width: 0; }

        .essay-back {
            display: inline-block;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--fg4);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .essay-back:hover { color: var(--fg); }

        .essay-kicker {
            font-family: var(--font-sans);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--fg5);
            margin-bottom: 0.75rem;
            display: block;
        }

        .right-col h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.5rem, 3.5vw, 2.1rem);
            font-weight: 600;
            line-height: 1.15;
            color: var(--fg);
            margin: 0 0 0.5rem;
            letter-spacing: -0.01em;
        }

        .essay-subtitle {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-style: italic;
            color: var(--fg4);
            margin: 0 0 2rem;
        }

        /* ── Article content ── */
        .content {
            border-top: 1px solid var(--border);
            padding-top: 1.75rem;
        }

        .content p { margin: 0 0 1.25em; color: var(--fg); }

        .content p.dropcap::first-letter {
            font-size: 3.3em;
            font-weight: 600;
            float: left;
            line-height: 0.78;
            margin-right: 0.06em;
            margin-top: 0.06em;
            color: var(--fg);
        }

        .content h2 {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 400;
            font-style: italic;
            color: var(--fg2);
            margin: 2.4em 0 0.75em;
        }

        .content blockquote {
            border-left: 2px solid color-mix(in srgb, var(--fg4) 35%, var(--bg) 65%);
            color: var(--fg2);
            margin: 1.6rem 0;
            padding: 0.1rem 0 0.1rem 1.25rem;
        }

        .content blockquote p {
            font-style: italic;
            font-size: 1rem;
            line-height: 1.55;
            margin-bottom: 0.4em;
            color: var(--fg2);
        }

        .content blockquote cite {
            display: block;
            font-style: normal;
            font-family: var(--font-sans);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--fg5);
            margin-top: 0.6rem;
        }

        .content em { font-style: italic; }
        .content strong { font-weight: 600; }

        .content a {
            color: inherit;
            text-decoration: underline;
            text-decoration-color: var(--link-underline);
            transition: color 0.2s, text-decoration-color 0.2s;
        }

        .content a:hover {
            color: var(--fg2);
            text-decoration-color: color-mix(in srgb, var(--fg2) 40%, transparent);
        }

        /* ── Footer ── */
        .essay-footer {
            margin-top: 2.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            font-family: var(--font-sans);
        }

        .essay-footer a {
            font-size: 0.82rem;
            color: var(--fg4);
            text-decoration: none;
            transition: color 0.2s;
        }

        .essay-footer a:hover { color: var(--fg); }

        /* ── Mobile ── */
        @media (max-width: 680px) {
            .page-grid {
                grid-template-columns: 1fr;
                margin-top: calc(54px + 1.5rem);
                padding: 0 1.2rem;
                row-gap: 0.5rem;
            }

            .left-col {
                position: static;
                text-align: left;
                display: flex;
                align-items: baseline;
                gap: 1.5rem;
                flex-wrap: wrap;
            }

            .page-title { margin-bottom: 0; }
            .page-meta { flex-direction: row; flex-wrap: wrap; gap: 0.8rem; }

            .right-col h1 { font-size: 1.5rem; }
        }
    </style>
    <script>
        (function() {
            var root = document.documentElement;
            function applyTheme(t) {
                if (t === 'dark') root.setAttribute('data-theme','dark');
                else root.removeAttribute('data-theme');
            }
            var stored; try { stored = localStorage.getItem('theme'); } catch(e) {}
            var sys = false; try { sys = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) {}
            applyTheme(stored || (sys ? 'dark' : 'light'));
        })();
    </script>
</head>
<body>
    <header class="site-nav">
        <div class="nav-left">
            <a href="{{ site.baseurl }}/">Luc Xie</a>
            <span class="nav-sep">/</span>
            <a href="{{ site.baseurl }}/projects/">Projects</a>
            <span class="nav-sep">/</span>
            <a href="{{ site.baseurl }}/essays/">Essays</a>
        </div>
        <button id="themeBtn" class="theme-btn" aria-label="Toggle theme"></button>
    </header>

    <div class="page-outer">
        <div class="page-grid">
            <div class="left-col">
                <h1 class="page-title">Luc Xie</h1>
                <div class="page-meta">
                    <span>langxiao [dot] xie [at] berkeley [dot] edu</span>
                    <a href="https://linkedin.com/in/lucas-x-019b67174">LinkedIn</a>
                    <a href="https://github.com/LangxiaoXie">GitHub</a>
                </div>
            </div>
            <div class="right-col">
                <a href="{{ site.baseurl }}/essays/" class="essay-back">← Essays</a>
                <span class="essay-kicker">Essay</span>
                <h1>{{ page.title }}</h1>
                {% if page.subtitle %}<p class="essay-subtitle">{{ page.subtitle }}</p>{% endif %}
                <div class="content">
                    {{ content }}
                </div>
                <div class="essay-footer">
                    <a href="{{ site.baseurl }}/essays/">← Back to essays</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var root = document.documentElement;
            function applyTheme(t) {
                if (t === 'dark') root.setAttribute('data-theme','dark');
                else root.removeAttribute('data-theme');
            }
            function getStored() { try { return localStorage.getItem('theme'); } catch(e) { return null; } }
            function setStored(t) { try { localStorage.setItem('theme', t); } catch(e) {} }
            var btn = document.getElementById('themeBtn');
            if (btn) {
                btn.addEventListener('click', function() {
                    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    applyTheme(next); setStored(next);
                });
            }
            var mql; try { mql = window.matchMedia('(prefers-color-scheme: dark)'); } catch(e) {}
            if (mql) {
                var fn = function(e) { if (!getStored()) applyTheme(e.matches ? 'dark' : 'light'); };
                if (mql.addEventListener) mql.addEventListener('change', fn);
                else if (mql.addListener) mql.addListener(fn);
            }
        })();
    </script>
</body>
</html>
